spring.application.name=elearning

# Nap secret tu file local (neu co) - file nay KHONG commit len git.
# Gia tri trong application-local.properties se ghi de cac key ben duoi.
spring.config.import=optional:file:./application-local.properties

# ===== Database (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/elearning_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Mo session trong suot qua trinh render view (tranh LazyInitializationException
# khi template doc cac quan he lazy nhu course.category, course.instructor)
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Upload (multipart) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===== Cloudinary =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# ===== SePay (chuyen khoan + webhook) =====
# API key phai trung voi cau hinh webhook tren my.sepay.vn
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:sepay_key_hsf302_project_2026}
# Tai khoan nhan tien (theo dung tai khoan da lien ket tren SePay)
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:0968097907}
sepay.account-name=${SEPAY_ACCOUNT_NAME:NGO HOANG TRUONG DAT}
sepay.bank=${SEPAY_BANK:MBBank}
sepay.prefix=DH
sepay.qr-base-url=https://qr.sepay.vn/img

# ===== Ollama Local AI =====
ollama.url=http://localhost:11434
ollama.model=qwen2.5:3b

# ===== Quiz =====
# Diem dat toi thieu (%) de hoan thanh bai hoc va duoc cap chung chi
quiz.pass-score=70
# So cau hoi AI sinh moi bai hoc
quiz.num-questions=5

# ===== Server =====
server.port=8080
