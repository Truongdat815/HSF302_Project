<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body>
<div class="admin-shell">
    <input id="adminSidebarToggle" class="admin-sidebar-toggle" type="checkbox"/>
    <aside th:replace="~{fragments/layout :: adminSidebar('categories')}"></aside>

    <main class="admin-main">
        <div class="admin-main-inner">
            <div class="admin-topline">
                <div>
                    <div class="page-eyebrow">Catalog</div>
                    <h1 class="page-title">Quản lý danh mục</h1>
                    <p class="page-subtitle">Có thể đổi tên danh mục bất cứ lúc nào. Chỉ xóa danh mục khi chưa có khóa học nào đang dùng.</p>
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="${editCategory != null} ? @{/admin/categories/{id}(id=${editCategory.id})} : @{/admin/categories}"
                  method="post" class="row g-2 mb-4 form-card panel">
                <div class="col flex-grow-1">
                    <label class="form-label" th:text="${editCategory != null} ? 'Tên danh mục mới' : 'Tên danh mục'">Tên danh mục</label>
                    <input class="form-control" name="name" placeholder="Tên danh mục"
                           th:value="${editCategory != null ? editCategory.name : ''}" required/>
                </div>
                <div class="col-auto d-flex align-items-end gap-2">
                    <button class="btn btn-primary" th:text="${editCategory != null} ? 'Lưu thay đổi' : 'Thêm'">Thêm</button>
                    <a th:if="${editCategory != null}" class="btn btn-secondary" th:href="@{/admin/categories}">Hủy</a>
                </div>
            </form>

            <div class="table-wrap">
                <table class="table align-middle">
                    <thead><tr><th>#</th><th>Tên</th><th>Slug</th><th>Khóa học</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                    <tbody>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.id}">1</td>
                        <td class="fw-bold" th:text="${cat.name}">Tên</td>
                        <td th:text="${cat.slug}">slug</td>
                        <td th:text="${categoryCourseCounts[cat.id]}">0</td>
                        <td>
                            <span th:if="${categoryCourseCounts[cat.id] > 0}" class="badge text-bg-info">Đang dùng</span>
                            <span th:unless="${categoryCourseCounts[cat.id] > 0}" class="badge text-bg-secondary">Có thể xóa</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/categories/{id}/edit(id=${cat.id})}">Sửa</a>
                            <form th:if="${categoryCourseCounts[cat.id] == 0}" class="d-inline"
                                  th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                            </form>
                            <span th:if="${categoryCourseCounts[cat.id] > 0}" class="text-muted small">Không xóa khi còn khóa học</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
