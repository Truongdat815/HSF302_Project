<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách khóa học')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>

<div class="container py-4">
    <div class="page-head">
        <div>
            <div class="page-eyebrow">Course library</div>
            <h1 class="page-title">Tất cả khóa học</h1>
            <p class="page-subtitle">Tìm khóa học phù hợp và xem thông tin chi tiết trước khi đăng ký.</p>
        </div>
    </div>

    <form class="row g-2 mb-4 panel form-card" th:action="@{/courses}" method="get">
        <div class="col flex-grow-1">
            <input class="form-control" name="q" th:value="${q}" placeholder="Tìm kiếm khóa học..."/>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Tìm</button>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-4" th:each="course : ${courses}">
            <div class="card course-card h-100">
                <img th:if="${course.thumbnailUrl}" th:src="${course.thumbnailUrl}"
                     class="card-img-top" alt="thumbnail"/>
                <div th:unless="${course.thumbnailUrl}"
                     class="course-thumb bg-secondary-subtle d-flex align-items-center justify-content-center">
                    <i class="bi bi-image fs-1 text-secondary"></i>
                </div>
                <div class="card-body d-flex flex-column">
                    <span th:if="${course.category != null}" class="course-tag"
                          th:text="${course.category.name}">Danh mục</span>
                    <h5 class="card-title" th:text="${course.title}">Tên</h5>
                    <p class="card-text text-muted small" th:text="${course.shortDescription}">Mô tả</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center gap-2">
                        <span class="fw-bold text-danger"
                              th:text="${#numbers.formatDecimal(course.price,0,'COMMA',0,'POINT')} + ' đ'">0 đ</span>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/courses/{slug}(slug=${course.slug})}">Chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(courses)}" class="alert alert-info">Không tìm thấy khóa học nào.</div>
    </div>
</div>

<div th:replace="~{fragments/layout :: chatWidget}"></div>
</body>
</html>
