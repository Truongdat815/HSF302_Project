<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Khóa học')}"></head>
<body>
<div class="admin-shell">
    <input id="adminSidebarToggle" class="admin-sidebar-toggle" type="checkbox"/>
    <aside th:replace="~{fragments/layout :: adminSidebar('new-course')}"></aside>

    <main class="admin-main">
        <div class="admin-main-inner">
            <div class="admin-topline">
                <div>
                    <div class="page-eyebrow">Course editor</div>
                    <h1 class="page-title" th:text="${form.id != null} ? 'Sửa khóa học' : 'Thêm khóa học'">Khóa học</h1>
                    <p class="page-subtitle">Cập nhật thông tin hiển thị, giá bán, danh mục và trạng thái xuất bản.</p>
                </div>
                <div class="admin-topline-actions">
                    <a class="btn btn-secondary" th:href="@{/admin/courses}">Quay lại</a>
                </div>
            </div>

            <form id="courseForm" class="content-panel form-card"
                  th:action="${form.id != null} ? @{/admin/courses/{id}(id=${form.id})} : @{/admin/courses}"
                  method="post" enctype="multipart/form-data" th:object="${form}">

                <div class="mb-3">
                    <label class="form-label">Tiêu đề</label>
                    <input class="form-control" th:field="*{title}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả ngắn</label>
                    <input class="form-control" th:field="*{shortDescription}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả chi tiết</label>
                    <div id="editorQuill"></div>
                    <textarea id="editor" th:field="*{description}" class="d-none"></textarea>
                    <small class="text-muted">Dùng thanh công cụ để chỉnh cỡ chữ, màu sắc, in đậm/nghiêng cho từng đoạn.</small>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Giá (VND)</label>
                        <input type="number" step="1000" min="0" class="form-control" th:field="*{price}" required/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Danh mục</label>
                        <select class="form-select" th:field="*{categoryId}">
                            <option value="">-- Chọn --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">DM</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">DRAFT</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Ảnh thumbnail</label>
                    <input type="file" name="thumbnail" accept="image/*" class="form-control"/>
                    <div th:if="${course != null and course.thumbnailUrl != null}" class="mt-3">
                        <img th:src="${course.thumbnailUrl}" class="current-thumb" alt="current"/>
                        <small class="text-muted d-block mt-2">Ảnh hiện tại, bỏ trống nếu không đổi.</small>
                    </div>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-primary" type="submit">Lưu khóa học</button>
                    <a class="btn btn-secondary" th:href="@{/admin/courses}">Hủy</a>
                </div>
            </form>
        </div>
    </main>
</div>

<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet"/>
<style>
    #editorQuill .ql-editor { min-height: 220px; font-size: 1rem; }
    #editorQuill { background: #fff; border: 0 0 12px 12px; }
    .ql-toolbar.ql-snow { border-radius: 12px 12px 0 0; border-color: var(--line); }
    .ql-container.ql-snow { border-radius: 0 0 12px 12px; border-color: var(--line); }
</style>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
    Quill.register(Quill.import('attributors/style/size'), true);
    Quill.register(Quill.import('attributors/style/align'), true);

    const quill = new Quill('#editorQuill', {
        theme: 'snow',
        placeholder: 'Nhập mô tả chi tiết...',
        modules: {
            toolbar: [
                [{ header: [1, 2, 3, false] }],
                [{ size: ['small', false, 'large', 'huge'] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ color: [] }, { background: [] }],
                [{ list: 'ordered' }, { list: 'bullet' }],
                [{ align: [] }],
                ['link', 'blockquote'],
                ['clean']
            ]
        }
    });

    const courseDesc = document.querySelector('#editor');
    if (courseDesc.value && courseDesc.value.trim()) {
        quill.clipboard.dangerouslyPasteHTML(courseDesc.value);
    }
    document.querySelector('#courseForm').addEventListener('submit', () => {
        courseDesc.value = quill.getText().trim().length === 0 ? '' : quill.root.innerHTML;
    });
</script>
</body>
</html>
