<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chứng chỉ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>

<div class="container py-5">
    <div class="certificate-card">
        <i class="bi bi-award-fill text-warning fs-1"></i>
        <h2 class="mt-2">CHỨNG CHỈ HOÀN THÀNH</h2>
        <p class="text-muted">Chứng nhận rằng</p>
        <h3 class="fw-bold" th:text="${enrollment.student.fullName}">Học viên</h3>
        <p class="text-muted">đã hoàn thành khóa học</p>
        <h4 class="text-primary" th:text="${enrollment.course.title}">Tên khóa học</h4>
        <hr/>
        <p class="mb-0">Mã chứng chỉ: <strong th:text="${certificate.code}">CERT-XXX</strong></p>
        <p class="text-muted small"
           th:text="'Ngày cấp: ' + ${#temporals.format(certificate.issuedAt,'dd/MM/yyyy')}">Ngày cấp</p>
        <a class="btn btn-outline-secondary btn-sm mt-2" th:href="@{/my-courses}">Quay lại</a>
    </div>
</div>
</body>
</html>
