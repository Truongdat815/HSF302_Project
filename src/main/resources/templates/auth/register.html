<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>

<div class="auth-shell">
    <div class="auth-card">
        <div class="page-eyebrow text-center">Create account</div>
        <h3>Đăng ký tài khoản</h3>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label">Họ tên</label>
                <input type="text" name="fullName" class="form-control" required autofocus/>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" required minlength="6"/>
            </div>
            <button class="btn btn-primary w-100" type="submit">Đăng ký</button>
        </form>
        <p class="text-center mt-3">Đã có tài khoản?
            <a th:href="@{/login}">Đăng nhập</a></p>
    </div>
</div>
</body>
</html>
