<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">E-learning</title>
    <link rel="icon" type="image/svg+xml" href="/images/logo-mark.svg"/>
    <link rel="apple-touch-icon" href="/images/logo-mark.svg"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>

<!-- ===== HEADER ===== -->
<nav th:fragment="header" class="navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <img class="brand-logo-mark" src="/images/logo-mark.svg" alt="Duolingo"/>
            <span class="brand-copy"><strong>Duo</strong><em>lingo</em></span>
        </a>
        <div class="navbar-nav main-nav me-auto">
            <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door"></i> Trang chủ</a>
            <a class="nav-link" th:href="@{/courses}"><i class="bi bi-grid"></i> Khóa học</a>
            <a sec:authorize="hasAuthority('ROLE_STUDENT')" class="nav-link" th:href="@{/my-courses}">
                <i class="bi bi-play-circle"></i> Khóa học của tôi</a>
            <a sec:authorize="hasAuthority('ROLE_STUDENT')" class="nav-link" th:href="@{/cart}">
                <i class="bi bi-cart"></i> Giỏ hàng</a>
        </div>
        <div class="navbar-nav user-nav">
            <a sec:authorize="isAnonymous()" class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</a>
            <a sec:authorize="isAnonymous()" class="nav-link" th:href="@{/register}"><i class="bi bi-person-plus"></i> Đăng ký</a>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-link" th:href="@{/admin}">
                <i class="bi bi-speedometer2"></i> Quản trị</a>
            <span sec:authorize="isAuthenticated()" class="nav-link account-email"
                  sec:authentication="name">user</span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-sm btn-outline-light ms-2" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<!-- ===== ADMIN SIDEBAR ===== -->
<aside th:fragment="adminSidebar(active)" class="admin-sidebar">
    <div class="admin-side-top">
        <a class="admin-brand" th:href="@{/admin}">
            <img class="brand-logo-mark" src="/images/logo-mark.svg" alt="Duolingo"/>
            <span class="admin-brand-text"><strong>Duolingo</strong><small>Admin</small></span>
        </a>
        <label for="adminSidebarToggle" class="admin-collapse-btn" title="Thu/mở menu">
            <i class="bi bi-layout-sidebar-inset"></i>
        </label>
    </div>

    <div class="admin-profile">
        <span class="admin-avatar"><i class="bi bi-person-gear"></i></span>
        <span class="admin-profile-text">
            <strong>Quản trị</strong>
            <small sec:authentication="name">admin@fpt.edu.vn</small>
        </span>
    </div>

    <nav class="admin-side-nav">
        <a th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/admin}">
            <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>
        <a th:classappend="${active == 'new-course'} ? ' active'" th:href="@{/admin/courses/new}">
            <i class="bi bi-plus-square"></i><span>Tạo khóa học</span>
        </a>
        <a th:classappend="${active == 'courses'} ? ' active'" th:href="@{/admin/courses}">
            <i class="bi bi-journal-bookmark"></i><span>Quản lý khóa học</span>
        </a>
        <a th:classappend="${active == 'users'} ? ' active'" th:href="@{/admin/users}">
            <i class="bi bi-people"></i><span>Quản lý học sinh</span>
        </a>
        <a th:classappend="${active == 'categories'} ? ' active'" th:href="@{/admin/categories}">
            <i class="bi bi-tags"></i><span>Danh mục</span>
        </a>
        <a th:classappend="${active == 'coupons'} ? ' active'" th:href="@{/admin/coupons}">
            <i class="bi bi-ticket-perforated"></i><span>Mã giảm giá</span>
        </a>
    </nav>

    <div class="admin-side-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" title="Đăng xuất">
                <i class="bi bi-box-arrow-left"></i><span>Đăng xuất</span>
            </button>
        </form>
    </div>
</aside>

<!-- ===== CHAT WIDGET (RAG - chi lay du lieu khoa hoc trong DB) ===== -->
<div th:fragment="chatWidget">
    <button id="chatToggle" class="chat-fab" type="button" aria-label="Chat tro ly">
        <i class="bi bi-chat-dots-fill"></i>
    </button>
    <div id="chatPanel" class="chat-panel" hidden>
        <div class="chat-head">
            <span><i class="bi bi-robot"></i> Trợ lý khóa học</span>
            <button id="chatClose" class="chat-x" type="button" aria-label="Dong">&times;</button>
        </div>
        <div id="chatBody" class="chat-body">
            <div class="chat-msg bot">Xin chào! Hỏi mình về khóa học nhé — ví dụ: "Có khóa học nào về Java không?"</div>
        </div>
        <form id="chatForm" class="chat-input">
            <input id="chatText" type="text" placeholder="Nhập câu hỏi..." autocomplete="off"/>
            <button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-send"></i></button>
        </form>
    </div>

    <script>
        (function () {
            const fab = document.getElementById('chatToggle');
            if (!fab) return;
            const panel = document.getElementById('chatPanel');
            const body = document.getElementById('chatBody');
            const form = document.getElementById('chatForm');
            const text = document.getElementById('chatText');
            const closeBtn = document.getElementById('chatClose');

            fab.addEventListener('click', () => {
                panel.hidden = !panel.hidden;
                if (!panel.hidden) text.focus();
            });
            closeBtn.addEventListener('click', () => panel.hidden = true);

            function add(msg, cls) {
                const d = document.createElement('div');
                d.className = 'chat-msg ' + cls;
                d.textContent = msg;
                body.appendChild(d);
                body.scrollTop = body.scrollHeight;
                return d;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const q = text.value.trim();
                if (!q) return;
                add(q, 'user');
                text.value = '';
                const loading = add('Đang trả lời...', 'bot loading');
                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: q })
                    });
                    const data = await res.json();
                    loading.remove();
                    add(data.answer || 'Xin lỗi, hiện chưa có phản hồi.', 'bot');
                } catch (err) {
                    loading.remove();
                    add('Lỗi kết nối tới trợ lý. Vui lòng thử lại.', 'bot');
                }
            });
        })();
    </script>
</div>

</body>
</html>
